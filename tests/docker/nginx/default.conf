# Two vhosts against the same WP install:
#   :80  — uncached, the core suite runs here
#   :81  — FastCGI-cached, the FPC smoke suite runs here
#
# The cached vhost deliberately does NOT set fastcgi_ignore_headers: a
# Set-Cookie or Cache-Control: no-cache from PHP prevents caching, which is
# exactly the "plugin busts the cache" signal the FPC tests assert on via
# X-Cache-Status.

fastcgi_cache_path /var/cache/nginx/oriel keys_zone=ORIEL:10m max_size=64m inactive=60m;

upstream wp-fpm {
    server wp:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wp-fpm;
    }
}

server {
    listen 81;
    server_name _;
    root /var/www/html;
    index index.php;

    # Standard FPC bypass rules, mirroring common production configs:
    # POSTs, query strings, and logged-in/comment cookies skip the cache.
    set $skip_cache 0;

    if ($request_method = POST) {
        set $skip_cache 1;
    }
    if ($query_string != "") {
        set $skip_cache 1;
    }
    if ($http_cookie ~* "wordpress_logged_in|wp-postpass|comment_author") {
        set $skip_cache 1;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wp-fpm;

        fastcgi_cache ORIEL;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 10m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
